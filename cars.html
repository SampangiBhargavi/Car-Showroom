<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DriveX Motors | Cars</title>


    <link
        rel="stylesheet"
        href="node_modules/bootstrap/dist/css/bootstrap.css"
    >

    <link
        rel="stylesheet"
        href="node_modules/bootstrap-icons/font/bootstrap-icons.css"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div id="navbar"></div>


<section class="page-banner">

    <div class="container">

        <h1>Our Cars</h1>

        <p>
            Explore our collection of premium cars.
        </p>

    </div>

</section>



<section class="py-5">

    <div class="container">


        <div class="row g-3 mb-5">


            <div class="col-md-4">

                <input
                    type="text"
                    id="searchCar"
                    class="form-control"
                    placeholder="Search car"
                >

            </div>


            <div class="col-md-3">

                <select
                    id="brandFilter"
                    class="form-select"
                >

                    <option value="">
                        All Brands
                    </option>

                </select>

            </div>


            <div class="col-md-3">

                <select
                    id="categoryFilter"
                    class="form-select"
                >

                    <option value="">
                        All Categories
                    </option>

                </select>

            </div>


            <div class="col-md-2">

                <button
                    type="button"
                    class="btn btn-warning w-100"
                    onclick="displayCars()"
                >

                    <i class="bi bi-search"></i>

                    Search

                </button>

            </div>


        </div>


        <div
            id="carList"
            class="row g-4"
        ></div>


    </div>

</section>


<div id="footer"></div>


<script src="node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>

<script src="script.js"></script>

<script src="cars.js"></script>


</body>

</html>
