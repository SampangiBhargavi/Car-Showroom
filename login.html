<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | DriveX Motors</title>

    <link rel="stylesheet"
          href="node_modules/bootstrap/dist/css/bootstrap.css">

    <link rel="stylesheet"
          href="node_modules/bootstrap-icons/font/bootstrap-icons.css">

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div id="navbar"></div>


<section class="py-5">

    <div class="container">

        <div class="login-card">

            <div class="text-center">

                <i class="bi bi-person-circle display-3 text-warning"></i>

                <h2 class="mt-3">
                    Customer Login
                </h2>

            </div>


            <form onsubmit="customerLogin(event)">

                <input id="loginEmail"
                       type="email"
                       class="form-control mb-3"
                       placeholder="Email"
                       required>


                <input id="loginPassword"
                       type="password"
                       class="form-control mb-3"
                       placeholder="Password"
                       required>


                <button class="btn btn-warning w-100">

                    Login

                </button>

            </form>

        </div>

    </div>

</section>


<div id="footer"></div>


<script src="node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>

<script src="script.js"></script>

</body>

</html>
